<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c11">
  <title>{% block title %}ASTRA RESQ{% endblock %}</title>
  <meta name="description" content="NavIC-based positioning and emergency SOS coordination for areas with no mobile network.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="page-{{ page }}">
  <header class="site-header">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>ASTRA RESQ<small>NavIC SOS</small></a>
    <nav class="nav">
      <a href="/" class="{{ 'active' if page == 'home' }}">Overview</a>
      <a href="/sos" class="{{ 'active' if page == 'sos' }}">Victim device</a>
      <a href="/dashboard" class="{{ 'active' if page == 'dashboard' }}">Rescue dashboard</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
  <div id="toasts" aria-live="polite"></div>
  <script src="/js/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
